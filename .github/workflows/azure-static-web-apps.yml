name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  CUSTOM_DOMAIN: myresume.chvt.fr

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "out"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"

  configure_custom_domain_job:
    if: github.event_name == 'push'
    needs: build_and_deploy_job
    runs-on: ubuntu-latest
    name: Configure Custom Domain Job
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure custom domain is configured
        env:
          SWA_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME || 'myresume' }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'myresume-rg' }}
        run: |
          existing=$(az staticwebapp hostname list \
            --name "$SWA_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='$CUSTOM_DOMAIN'].name" -o tsv)
          if [ -z "$existing" ]; then
            az staticwebapp hostname set \
              --name "$SWA_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --hostname "$CUSTOM_DOMAIN" \
              --validation-method cname-delegation
          else
            echo "Custom domain $CUSTOM_DOMAIN already configured."
          fi
